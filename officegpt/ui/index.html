<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OfficeGPT</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <style>
    :root{
      --bg: #f5f7fa;
      --card: #ffffff;
      --muted: #6b7280;
      --accent: #0f172a;
      --bubble-user: #e6f0ff;
      --bubble-assistant: #ffffff;
      --border: #e6e9ee;
      --radius: 12px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
    }
    html,body{height:100%;margin:0;background:var(--bg);color:var(--accent);}
    .app{
      max-width:900px;margin:24px auto;display:flex;flex-direction:column;height:calc(100vh - 48px);
      box-shadow: 0 4px 18px rgba(12,18,28,0.06);
      border-radius:14px;overflow:hidden;background:var(--card);
    }
    .header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
    .brand{font-weight:600;font-size:18px}
    .chat-area{flex:1;overflow:auto;padding:20px;background:linear-gradient(180deg,transparent,rgba(0,0,0,0.01));}
    .messages{display:flex;flex-direction:column;gap:12px;max-width:780px;margin:0 auto}

    .msg{display:flex;align-items:flex-end;gap:12px}
    .msg.user{justify-content:flex-end}
    .bubble{padding:12px 14px;border-radius:12px;max-width:76%;box-shadow:0 1px 0 rgba(16,24,40,0.03)}
    .bubble.user{background:var(--bubble-user);border-top-right-radius:6px;}
    .bubble.assistant{background:var(--bubble-assistant);border:1px solid var(--border);border-top-left-radius:6px;}

    /* ── Markdown rendered content ── */
    .bubble.assistant p { margin: 0 0 8px; line-height: 1.6; }
    .bubble.assistant p:last-child { margin-bottom: 0; }
    .bubble.assistant ul, .bubble.assistant ol { padding-left: 20px; margin: 6px 0; }
    .bubble.assistant li { margin-bottom: 4px; line-height: 1.5; }
    .bubble.assistant strong { font-weight: 600; }
    .bubble.assistant code { background: #f1f5f9; padding: 2px 5px; border-radius: 4px; font-size: 13px; }
    .bubble.assistant pre { background: #f1f5f9; padding: 10px; border-radius: 8px; overflow-x: auto; }
    .bubble.assistant pre code { background: none; padding: 0; }
    .bubble.assistant h1,.bubble.assistant h2,.bubble.assistant h3 { margin: 10px 0 6px; font-size: 15px; }

    /* ── Markdown TABLE styles ── */
    .bubble.assistant table {
      border-collapse: collapse;
      width: 100%;
      margin: 10px 0;
      font-size: 13.5px;
    }
    .bubble.assistant th {
      background: #f1f5f9;
      padding: 8px 12px;
      text-align: left;
      font-weight: 600;
      border: 1px solid var(--border);
    }
    .bubble.assistant td {
      padding: 7px 12px;
      border: 1px solid var(--border);
    }
    .bubble.assistant tr:nth-child(even) td {
      background: #f8fafc;
    }
    .bubble.assistant tr:hover td {
      background: #eef4ff;
    }

    .meta{font-size:12px;color:var(--muted);margin-top:6px}
    .footer{padding:12px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center}
    .input{flex:1;display:flex;gap:8px}
    input[type="text"]{flex:1;padding:10px 12px;border-radius:10px;border:1px solid var(--border);font-size:15px}
    button{background:#0b5cff;color:white;border:none;padding:10px 14px;border-radius:10px;font-weight:600;cursor:pointer}
    button:disabled{opacity:0.6;cursor:not-allowed}

    .sources{margin-top:8px;font-size:13px;color:var(--muted)}
    .source-item{background:#fbfdff;border:1px solid var(--border);padding:8px;border-radius:8px;margin-top:6px}
    .source-header{display:flex;justify-content:space-between;cursor:pointer}
    .source-body{margin-top:8px;display:none}

    .loader{width:64px;height:12px;border-radius:8px;background:linear-gradient(90deg,#e6eefc,#cfe0ff,#e6eefc);animation:shimmer 1.2s linear infinite}
    @keyframes shimmer{0%{transform:translateX(-10px)}100%{transform:translateX(10px)}}

    @media (max-width:640px){.app{margin:8px;height:calc(100vh - 16px)}.messages{max-width:100%}}
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="brand" id="clientName">OfficeGPT</div>
      <div style="margin-left:auto;color:var(--muted);font-size:13px" id="assistantName">Assistant</div>
    </div>

    <div class="chat-area" id="chatArea">
      <div class="messages" id="messages"></div>
    </div>

    <div class="footer">
      <div class="input">
        <input type="text" id="questionInput" placeholder="Ask a question about company documents..." />
        <button id="sendBtn">Send</button>
      </div>
    </div>
  </div>

  <script>
    const assistantEl = document.getElementById('assistantName');
    const clientEl    = document.getElementById('clientName');
    const messagesEl  = document.getElementById('messages');
    const chatArea    = document.getElementById('chatArea');
    const inputEl     = document.getElementById('questionInput');
    const sendBtn     = document.getElementById('sendBtn');

    let assistantName = 'Assistant';
    let clientName    = 'Client';
    const STORAGE_KEY = 'officegpt_chat_history_v1';

    // Configure marked — enable tables (GFM)
    marked.setOptions({ gfm: true, breaks: true });

    fetch('/config').then(r => r.json()).then(cfg => {
      assistantName = cfg.assistant_name || assistantName;
      clientName    = cfg.client_name    || clientName;
      assistantEl.textContent = assistantName;
      clientEl.textContent    = clientName;
      loadHistory();
    }).catch(() => loadHistory());

    function loadHistory(){
      let history = [];
      try{ history = JSON.parse(sessionStorage.getItem(STORAGE_KEY) || '[]'); }catch(e){}
      history.forEach(item => renderMessage(item, false));
      scrollToBottom();
    }

    function saveMessage(msg){
      let history = [];
      try{ history = JSON.parse(sessionStorage.getItem(STORAGE_KEY) || '[]'); }catch(e){}
      history.push(msg);
      sessionStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    }

    function renderBubbleContent(bubble, role, text) {
      if (role === 'assistant') {
        // Render markdown (tables, bold, lists, code, etc.)
        bubble.innerHTML = marked.parse(text);
      } else {
        // User bubble — plain text, escape HTML
        bubble.textContent = text;
      }
    }

    function createMessageElement({role, text, sources}){
      const wrapper = document.createElement('div');
      wrapper.className = 'msg ' + (role === 'user' ? 'user' : 'assistant');

      const bubble = document.createElement('div');
      bubble.className = 'bubble ' + (role === 'user' ? 'user' : 'assistant');

      renderBubbleContent(bubble, role, text);
      wrapper.appendChild(bubble);

      // Collapsible sources for assistant
      if(role === 'assistant' && sources && sources.length){
        const sourcesDiv = document.createElement('div');
        sourcesDiv.className = 'sources';
        const hdr = document.createElement('div');
        hdr.className = 'source-item';
        const headerRow = document.createElement('div');
        headerRow.className = 'source-header';
        headerRow.innerHTML = '<strong>Sources</strong><span style="color:var(--muted)">Show</span>';
        hdr.appendChild(headerRow);
        const body = document.createElement('div');
        body.className = 'source-body';
        sources.forEach(s => {
          const item = document.createElement('div');
          item.style.marginBottom = '6px';
          item.innerHTML = `<div style="font-weight:600">${escapeHtml(s.source)}</div><div style="color:var(--muted);font-size:13px">Page: ${s.page}</div>`;
          body.appendChild(item);
        });
        hdr.appendChild(body);
        headerRow.addEventListener('click', () => {
          const shown = body.style.display === 'block';
          body.style.display = shown ? 'none' : 'block';
          headerRow.querySelector('span').textContent = shown ? 'Show' : 'Hide';
        });
        sourcesDiv.appendChild(hdr);
        wrapper.appendChild(sourcesDiv);
      }

      return wrapper;
    }

    function renderMessage(msg, save=true){
      const el = createMessageElement(msg);
      messagesEl.appendChild(el);
      if(save) saveMessage(msg);
      scrollToBottom();
    }

    function scrollToBottom(){
      setTimeout(() => { chatArea.scrollTop = chatArea.scrollHeight; }, 40);
    }

    function escapeHtml(s){
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"})[c]);
    }

    async function sendQuestion(){
      const q = inputEl.value.trim();
      if(!q) return;

      renderMessage({role:'user', text:q});
      inputEl.value = '';
      inputEl.disabled = true;
      sendBtn.disabled = true;

      // Thinking bubble
      const thinkingEl = createMessageElement({role:'assistant', text:'Thinking...'});
      messagesEl.appendChild(thinkingEl);
      scrollToBottom();

      try{
        const res = await fetch('/chat', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({question: q})
        });
        messagesEl.removeChild(thinkingEl);
        if(!res.ok){
          const txt = await res.text();
          renderMessage({role:'assistant', text:`Error: ${txt}`});
        } else {
          const data = await res.json();
          renderMessage({role:'assistant', text: data.answer || "I don't know", sources: data.sources || []});
        }
      } catch(e){
        messagesEl.removeChild(thinkingEl);
        renderMessage({role:'assistant', text:`Network error: ${e}`});
      } finally{
        inputEl.disabled = false;
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    sendBtn.addEventListener('click', sendQuestion);
    inputEl.addEventListener('keydown', e => { if(e.key === 'Enter') sendQuestion(); });
    inputEl.focus();
  </script>
</body>
</html>
